; Raises PHP's own upload ceiling above our app-level 8MB limit in
; api/items/image.php (MAX_UPLOAD_BYTES). Without this, PHP's stock
; defaults (commonly 2M upload_max_filesize on shared hosting) reject
; the request before our code ever runs, and post_max_size overruns
; print a raw PHP warning ahead of our JSON error response instead of
; the clean 422 we want. .user.ini (rather than .htaccess) works
; whether the host runs mod_php, PHP-FPM, or suPHP.
upload_max_filesize = 10M
post_max_size = 10M
display_errors = Off
